services:

  flask-mvp:
    build: .
    container_name: flask-mvp

    ports:
      - "5000:5000"

    volumes:
      - .:/app

    environment:
      - FLASK_ENV=development

    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: flask_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: